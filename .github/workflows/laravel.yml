name: Laravel + MySQL 🚀

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 
          MYSQL_DATABASE: gestionnairedecontact
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📦 Récupérer le code
        uses: actions/checkout@v4

      - name: ⚙️ Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo_mysql
          coverage: none

      - name: 🧰 Installer Composer
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: ⚙️ Configurer l’environnement
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: 🗄️ Configurer la base de données
        run: |
          php artisan migrate --force

        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: gestionnairedecontact
          DB_USERNAME: root
          DB_PASSWORD: 

      - name: 🧪 Exécuter les tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: gestionnairedecontact
          DB_USERNAME: root
          DB_PASSWORD: 
